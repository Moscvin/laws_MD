name = "bot-legi-md"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "legi-md"
database_id = "21520a0e-5096-48e8-a138-c38d0f8a5391"

[vars]
# Modelele Gemini încercate în ordine. Când unul își atinge limita gratuită zilnică, se trece la următorul.
GEMINI_MODELS = "gemini-3.5-flash,gemini-flash-lite-latest,gemini-2.5-flash"
# Opțional: ID-urile Telegram care au voie să folosească botul, separate prin virgulă. Gol = oricine.
ALLOWED_USERS = ""

# Secrete (se setează cu `npx wrangler secret put NUME`, nu se scriu aici):
#   TELEGRAM_TOKEN, GEMINI_API_KEY, WEBHOOK_SECRET
